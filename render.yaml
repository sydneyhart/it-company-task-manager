databases:
  - name: taskline-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"
    ipAllowList: []

services:
  - type: web
    name: taskline-it-company
    runtime: python
    plan: free
    region: oregon
    branch: develop
    buildCommand: ./build.sh
    startCommand: python -m gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --access-logfile -
    healthCheckPath: /healthz/
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: taskline-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: TASKLINE_PUBLIC_DEMO
        value: "1"
      - key: TASKLINE_DEMO_USERNAME
        value: user
      - key: TASKLINE_DEMO_PASSWORD
        value: user12345
